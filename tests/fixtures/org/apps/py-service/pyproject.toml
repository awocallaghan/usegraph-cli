[project]
name = "py-service"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pylint>=3.2",
    "isort>=5.13",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pylint>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
