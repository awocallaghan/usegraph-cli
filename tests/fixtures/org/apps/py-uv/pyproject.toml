[project]
name = "py-uv"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
test = [
    {include-group = "dev"},
    "coverage>=7.0",
]

[tool.uv]
environments = ["python >= '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
