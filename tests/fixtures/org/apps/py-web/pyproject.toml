[tool.poetry]
name = "py-web"
version = "0.1.0"
description = "FastAPI web service"
authors = ["Test User <test@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
pydantic = "^2.8.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
ruff = "^0.5.0"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
